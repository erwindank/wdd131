<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review Submitted</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/review.js" defer></script>
</head>

<body>
    <header class="site-header">
        <h1>Thank You!</h1>
        <p class="subtitle">Your review has been received.</p>
    </header>

    <main class="container">
        <section class="confirmation">
            <h2 class="section-title">Confirmation</h2>
            <p id="confirmation-message">We appreciate your feedback.</p>
            <div class="review-summary" aria-live="polite">
                <p>Total reviews submitted: <strong id="review-count">0</strong></p>
            </div>
            <div class="form-actions">
                <a class="button-link" href="form.html">Submit another review</a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 WDD 131 Product Reviews</p>
    </footer>
</body>

</html>
